<div class="p-6 flex items-center justify-center bg-gray-50">
  <mat-card class="w-full max-w-lg p-5">
    <mat-card-header class="pb-3">
      <mat-card-title>
        Authentication
      </mat-card-title>
    </mat-card-header>
    <mat-divider class="m-4"></mat-divider>
      <mat-card-content [formGroup]="loginForm" class="mt-8">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Username - email</mat-label>
          <input matInput formControlName="username">
        </mat-form-field>
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password" type="password">
        </mat-form-field>
      </mat-card-content>
    <mat-card-actions align="end">
      <button (click)="login()" mat-raised-button color="primary">
        Login
      </button>
    </mat-card-actions>
  </mat-card>
</div>

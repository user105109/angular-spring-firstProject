<mat-toolbar color="primary">
  <button mat-icon-button (click)="myDrawer.toggle()">
    <mat-icon style="color: white">menu</mat-icon>
  </button>
  <span style="flex: auto"></span>
  <button routerLink="/admin/home" mat-button>Home</button>
  <button routerLink="/admin/profile" mat-button>Profile</button>
  @if (authService.roles.includes("ADMIN")) {
    <button mat-button [matMenuTriggerFor]="importItems">
      Import
      <mat-icon iconPositionEnd>keyboard_arrow_down</mat-icon>
    </button>
  }
  <mat-menu #importItems>
    <button routerLink="/admin/load-students" mat-menu-item>Load Student</button>
    <button routerLink="/admin/load-payments" mat-menu-item>Load Payments</button>
  </mat-menu>
  @if (authService.isAuthenticated)
  {
    <button mat-button>
      {{authService.username}}
    </button>
  }
  <button routerLink="/login" mat-raised-button color="accent" (click)="authService.logout()">Logout</button>
  <button mat-button>
  </button>
</mat-toolbar>
<mat-drawer-container>
  <mat-drawer #myDrawer
              style="width: 160px"
              mode="side"
              [opened]="true"
              position="start">
    <mat-list>
      <mat-list-item>
        <button routerLink="/admin/dashboard" mat-button>
          <mat-icon>dashboard</mat-icon>
          Dashboard
        </button>
      </mat-list-item>
      <mat-list-item>
        <button routerLink="/admin/students" mat-button>
          <mat-icon>people</mat-icon>
          Students
        </button>
      </mat-list-item>
      <mat-list-item>
        <button routerLink="/admin/payments" mat-button>
          <mat-icon>payment</mat-icon>
          Payments
        </button>
      </mat-list-item>
    </mat-list>
  </mat-drawer>
  <mat-drawer-content>
    <div style="min-height: 600px">
    <router-outlet></router-outlet>
    </div>
  </mat-drawer-content>
</mat-drawer-container>
